name: Bug report
description: Something in CLND doesn't work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: CLND version
      description: Output of `clnd version`
      placeholder: "0.8.1"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: "clnd install ripgrep"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Paste the full output, including the error.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
